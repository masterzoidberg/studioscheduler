name: Patch v38 roster compiler

on:
  push:
    branches:
      - feat/shared-rulebook-roster-compiler
    paths:
      - .github/workflows/patch-v38-roster-compiler.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Harden aliases and intake gate order
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260904193500_shared_rulebook_roster_compiler_v38.sql')
          text = path.read_text()
          old = '''  if private.required_class_name_v34(new.name) then\n    v_requirements:=private.rulebook_required_roster_v38(new.studio_id,new.name);\n    select coalesce(array_agg(value order by value),'{}'::text[]) into v_required_ids\n    from jsonb_array_elements_text(coalesce(v_requirements->'requiredStudentIds','[]'::jsonb)) value;\n\n    if coalesce(current_setting('dwde.reviewed_required_class_intake',true),'') <> 'on' then\n      raise exception 'REVIEWED_REQUIRED_CLASS_INTAKE_REQUIRED: % must be created through the reviewed required-class intake',new.name;\n    end if;\n'''
          new = '''  if private.required_class_name_v34(new.name) then\n    perform private.assert_reviewed_rulebook_v3_v36(new.studio_id);\n    if coalesce(current_setting('dwde.reviewed_required_class_intake',true),'') <> 'on' then\n      raise exception 'REVIEWED_REQUIRED_CLASS_INTAKE_REQUIRED: % must be created through the reviewed required-class intake',new.name;\n    end if;\n\n    v_requirements:=private.rulebook_required_roster_v38(new.studio_id,new.name);\n    select coalesce(array_agg(r.value order by r.value),'{}'::text[]) into v_required_ids\n    from jsonb_array_elements_text(coalesce(v_requirements->'requiredStudentIds','[]'::jsonb)) as r(value);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'intake target count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace("select coalesce(array_agg(value order by value),'{}'::text[]) into v_required_ids\n  from jsonb_array_elements_text(coalesce(v_requirements->'requiredStudentIds','[]'::jsonb)) value;",
                              "select coalesce(array_agg(r.value order by r.value),'{}'::text[]) into v_required_ids\n  from jsonb_array_elements_text(coalesce(v_requirements->'requiredStudentIds','[]'::jsonb)) as r(value);", 1)
          text = text.replace("select coalesce(array_agg(value order by value),'{}'::text[]) into v_rule_ids\n  from jsonb_array_elements_text(coalesce(v_requirements->'ruleIds','[]'::jsonb)) value;",
                              "select coalesce(array_agg(r.value order by r.value),'{}'::text[]) into v_rule_ids\n  from jsonb_array_elements_text(coalesce(v_requirements->'ruleIds','[]'::jsonb)) as r(value);", 1)
          text = text.replace("select coalesce(array_agg(value order by value),'{}'::text[]) into v_relationships\n  from jsonb_array_elements_text(coalesce(v_requirements->'relationshipLabels','[]'::jsonb)) value;",
                              "select coalesce(array_agg(r.value order by r.value),'{}'::text[]) into v_relationships\n  from jsonb_array_elements_text(coalesce(v_requirements->'relationshipLabels','[]'::jsonb)) as r(value);", 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260904193500_shared_rulebook_roster_compiler_v38.sql
          git commit -m "Harden shared Rulebook roster compiler"
          git push origin HEAD:${GITHUB_REF_NAME}
