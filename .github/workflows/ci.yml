name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: |
          npm --version
          npm ci
      - name: Planning integrity
        if: matrix.os == 'ubuntu-latest'
        run: python plans/check_integrity.py
      - name: Restore Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:db
      - name: Smoke-test rendered routes
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm start > /tmp/dwde-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /rulebook /schedule /readiness /planning-repairs /people /classes /scenarios /versions /settings; do
            echo "Checking $route"
            curl --silent --show-error --fail "http://127.0.0.1:3000$route" > /dev/null
          done

  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install application dependencies
        run: npm ci
      - name: Run disposable authenticated browser workflow
        env:
          STUDIO_SCHEDULER_E2E_ALLOW_DISPOSABLE: "1"
        run: npm run test:e2e
