name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: |
          npm --version
          npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-test rendered routes
        run: |
          npm start > /tmp/dwde-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /rulebook /schedule /readiness /planning-repairs /people /classes /scenarios /versions /settings; do
            echo "Checking $route"
            curl --silent --show-error --fail "http://127.0.0.1:3000$route" > /dev/null
          done
