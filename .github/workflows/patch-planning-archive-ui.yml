name: Patch planning archive UI

on:
  push:
    branches:
      - feat/planning-inventory-lifecycle
    paths:
      - .github/workflows/patch-planning-archive-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Patch active loaders and archive controls
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Active browser workspace state excludes archived inventory.
          wp = 'components/workspace-provider.tsx'
          for table, order in [
              ('teachers','name'),('rooms','name'),('students','name'),('class_definitions','name'),('class_sessions','id')
          ]:
              replace_once(
                  wp,
                  f'supabase.from("{table}").select("*").eq("studio_id", STUDIO_ID).order("{order}"),',
                  f'supabase.from("{table}").select("*").eq("studio_id", STUDIO_ID).is("archived_at", null).order("{order}"),',
              )

          # Canonical server/solver state excludes archived inventory too.
          ss = 'lib/server-studio-state.ts'
          for table in ['teachers','rooms','students','class_definitions','class_sessions']:
              replace_once(
                  ss,
                  f'supabase.from("{table}").select("*").eq("studio_id", studioId).order("id"),',
                  f'supabase.from("{table}").select("*").eq("studio_id", studioId).is("archived_at", null).order("id"),',
              )

          pv = 'components/people-view.tsx'
          replace_once(
              pv,
              'import { Building2, GraduationCap, Palette, Pencil, Plus, UserRound, UsersRound, X } from "lucide-react";',
              'import { Archive, Building2, GraduationCap, Palette, Pencil, Plus, UserRound, UsersRound, X } from "lucide-react";\nimport { PlanningArchivePanel } from "@/components/planning-archive-panel";\nimport { setPlanningEntityArchived } from "@/lib/planning-archive-client";',
          )
          replace_once(
              pv,
              '  async function saveRoom() {',
              '''  async function archiveEntity(entityType: "TEACHER" | "STUDENT" | "ROOM", entityId: string, name: string) {\n    if (!canEdit || saving) return;\n    setSaving(true);\n    setNotice("");\n    const result = await setPlanningEntityArchived({\n      entityType, entityId, archive: true,\n      reason: `Archived ${entityType.toLowerCase()} ${name} from active planning inventory`,\n      expectedPlanningDatasetVersion: currentPlanningDatasetVersion,\n    });\n    setSaving(false);\n    if (!result.ok) { setNotice(result.error || `Could not archive ${name}.`); return; }\n    setTeacher(null); setStudent(null); setRoom(null);\n    setCreatingTeacher(false); setCreatingStudent(false); setCreatingRoom(false);\n    await refresh();\n    setNotice(`${name} archived. It remains available in historical inventory and Planning Dataset advanced to v${result.planningDatasetVersion ?? "?"}.`);\n  }\n\n  async function saveRoom() {''',
          )
          replace_once(
              pv,
              '<div className="flex gap-2"><button onClick={() => { setTeacher(null); setCreatingTeacher(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !teacher.name.trim()} onClick={() => void saveTeacher()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingTeacher ? "Add teacher" : "Save teacher"}</button></div>',
              '<div className="flex flex-wrap gap-2">{!creatingTeacher ? <button disabled={saving} onClick={() => void archiveEntity("TEACHER", teacher.id, teacher.name)} className="inline-flex min-h-11 items-center gap-2 rounded-xl border border-amber-300 px-3 font-semibold text-amber-900 disabled:opacity-50"><Archive className="size-4" />Archive</button> : null}<button onClick={() => { setTeacher(null); setCreatingTeacher(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !teacher.name.trim()} onClick={() => void saveTeacher()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingTeacher ? "Add teacher" : "Save teacher"}</button></div>',
          )
          replace_once(
              pv,
              '<div className="flex gap-2"><button onClick={() => { setStudent(null); setCreatingStudent(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !student.name.trim() || !student.level.trim()} onClick={() => void saveStudent()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingStudent ? "Add student" : "Save student"}</button></div>',
              '<div className="flex flex-wrap gap-2">{!creatingStudent ? <button disabled={saving} onClick={() => void archiveEntity("STUDENT", student.id, student.name)} className="inline-flex min-h-11 items-center gap-2 rounded-xl border border-amber-300 px-3 font-semibold text-amber-900 disabled:opacity-50"><Archive className="size-4" />Archive</button> : null}<button onClick={() => { setStudent(null); setCreatingStudent(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !student.name.trim() || !student.level.trim()} onClick={() => void saveStudent()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingStudent ? "Add student" : "Save student"}</button></div>',
          )
          replace_once(
              pv,
              '<div className="flex gap-2"><button onClick={() => { setRoom(null); setCreatingRoom(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !room.name.trim()} onClick={() => void saveRoom()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingRoom ? "Add room" : "Save room"}</button></div>',
              '<div className="flex flex-wrap gap-2">{!creatingRoom ? <button disabled={saving} onClick={() => void archiveEntity("ROOM", room.id, room.name)} className="inline-flex min-h-11 items-center gap-2 rounded-xl border border-amber-300 px-3 font-semibold text-amber-900 disabled:opacity-50"><Archive className="size-4" />Archive</button> : null}<button onClick={() => { setRoom(null); setCreatingRoom(false); }} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !room.name.trim()} onClick={() => void saveRoom()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : creatingRoom ? "Add room" : "Save room"}</button></div>',
          )
          replace_once(
              pv,
              '      {teacher ? (',
              '      <PlanningArchivePanel entityTypes={["TEACHER", "STUDENT", "ROOM"]} />\n\n      {teacher ? (',
          )

          cv = 'components/classes-view.tsx'
          replace_once(
              cv,
              'import { Clock3, Pencil, Plus, Search, UsersRound, Wrench, X } from "lucide-react";',
              'import { Archive, Clock3, Pencil, Plus, Search, UsersRound, Wrench, X } from "lucide-react";\nimport { PlanningArchivePanel } from "@/components/planning-archive-panel";\nimport { setPlanningEntityArchived } from "@/lib/planning-archive-client";',
          )
          replace_once(
              cv,
              '  async function saveSessionDurations() {',
              '''  async function archiveClass() {\n    if (!editing || creating || activeRepair || !canEdit || saving) return;\n    setSaving(true);\n    setNotice("");\n    const result = await setPlanningEntityArchived({\n      entityType: "CLASS", entityId: editing.id, archive: true,\n      reason: `Archived class ${editing.name} from active planning inventory`,\n      expectedPlanningDatasetVersion: currentPlanningDatasetVersion,\n    });\n    setSaving(false);\n    if (!result.ok) { setNotice(result.error || `Could not archive ${editing.name}.`); return; }\n    const name = editing.name;\n    await refresh();\n    closeEditor();\n    setNotice(`${name} archived with its weekly sessions. Historical schedules retain their original identities; Planning Dataset advanced to v${result.planningDatasetVersion ?? "?"}.`);\n  }\n\n  async function saveSessionDurations() {''',
          )
          replace_once(
              cv,
              '<div className="flex gap-2"><button onClick={closeEditor} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !editing.name.trim() || !editing.subject.trim() || !editing.level.trim() || editing.durationMinutes <= 0 || editing.weeklyFrequency <= 0} onClick={() => void save()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : activeRepair ? "Apply reviewed repair" : creating ? "Add class" : "Save class"}</button></div>',
              '<div className="flex flex-wrap gap-2">{!creating && !activeRepair ? <button disabled={saving} onClick={() => void archiveClass()} className="inline-flex min-h-11 items-center gap-2 rounded-xl border border-amber-300 px-3 font-semibold text-amber-900 disabled:opacity-50"><Archive className="size-4" />Archive</button> : null}<button onClick={closeEditor} className="min-h-11 flex-1 rounded-xl border border-slate-300 font-semibold">Cancel</button><button disabled={saving || !editing.name.trim() || !editing.subject.trim() || !editing.level.trim() || editing.durationMinutes <= 0 || editing.weeklyFrequency <= 0} onClick={() => void save()} className="min-h-11 flex-1 rounded-xl bg-slate-950 font-semibold text-white disabled:opacity-50">{saving ? "Saving…" : activeRepair ? "Apply reviewed repair" : creating ? "Add class" : "Save class"}</button></div>',
          )
          replace_once(
              cv,
              '      {editing ? (',
              '      <PlanningArchivePanel entityTypes={["CLASS"]} />\n\n      {editing ? (',
          )

          for path in [wp, ss, pv, cv]:
              Path(path).write_text(Path(path).read_text())
          PY
          git diff --check
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/workspace-provider.tsx lib/server-studio-state.ts components/people-view.tsx components/classes-view.tsx
          git commit -m "Wire planning archive lifecycle into inventory UI"
          git push origin HEAD:${GITHUB_REF_NAME}
