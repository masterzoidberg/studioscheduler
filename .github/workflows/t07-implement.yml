name: T07 Implementation

on:
  push:
    branches: [feat/pre-cami-hardening]

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply T07 patch
        run: python .github/t07-apply.py
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:db

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply accepted T07 patch
        run: python .github/t07-apply.py
      - name: Remove one-time implementation helpers
        run: rm .github/t07-apply.py .github/workflows/t07-implement.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit T07
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/server-studio-state.ts app/api/solver/feasibility/route.ts scripts/test-db.mjs tests/coherent-solver-snapshot.test.ts supabase/migrations/20260907050000_coherent_solver_snapshot_v43.sql .github/t07-apply.py .github/workflows/t07-implement.yml
          git commit -m "feat: make solver snapshots coherent"
          git push origin HEAD:feat/pre-cami-hardening
