name: T08 Plan Finalize

on:
  push:
    branches:
      - feat/pre-cami-hardening
    paths:
      - .github/t08-plan-finalize.py
      - .github/workflows/t08-plan-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/pre-cami-hardening
      - name: Update canonical plan
        run: python .github/t08-plan-finalize.py
      - name: Remove one-time finalizer
        run: rm .github/t08-plan-finalize.py .github/workflows/t08-plan-finalize.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: accept T08 and queue T09"
          git push origin HEAD:feat/pre-cami-hardening
