name: T11 Authoritative Incremental Commands

on:
  push:
    branches:
      - feat/pre-cami-hardening

permissions:
  contents: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply T11 patch
        run: python .github/t11-apply.py apply
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: runner.os == 'Linux'
        run: npm run test:db

  commit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/pre-cami-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply accepted T11 patch
        run: python .github/t11-apply.py apply
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/schedule/incremental/route.ts lib/constraint-gate-equivalence.ts lib/manual-move-command.ts lib/constraint-engine.ts components/workspace-provider.tsx components/schedule/schedule-builder-panel.tsx supabase/migrations/20260907150000_authoritative_incremental_commands_v47.sql tests/incremental-schedule-command.test.ts tests/incremental-route-contract.test.ts tests/incremental-migration.test.ts scripts/test-db.mjs
          git commit -m "feat: route incremental schedule edits through authoritative IR"
      - name: Finalize canonical plan
        run: python .github/t11-apply.py finalize
      - name: Remove one-time helpers and commit handoff
        run: |
          rm .github/t11-apply.py .github/workflows/t11-implement.yml
          git add -A
          git commit -m "docs: accept T11 and queue T12"
          git push origin HEAD:feat/pre-cami-hardening
