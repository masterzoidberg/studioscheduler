name: Reconcile v39 migration ledger

on:
  push:
    branches:
      - chore/reconcile-v39-migration-ledger
    paths:
      - .github/workflows/reconcile-v39-ledger.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Align v39 filenames with Supabase ledger
        run: |
          git mv supabase/migrations/20260904221500_planning_dataset_confirmation_attestation_v39.sql supabase/migrations/20260904220608_planning_dataset_confirmation_attestation_v39.sql
          git mv supabase/migrations/20260904222000_retire_direct_v32_planning_confirmation.sql supabase/migrations/20260904220715_retire_direct_v32_planning_confirmation.sql
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/planning-confirmation-attestation-v39.test.ts')
          text = path.read_text()
          replacements = {
              '20260904221500_planning_dataset_confirmation_attestation_v39.sql': '20260904220608_planning_dataset_confirmation_attestation_v39.sql',
              '20260904222000_retire_direct_v32_planning_confirmation.sql': '20260904220715_retire_direct_v32_planning_confirmation.sql',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one test path for {old}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff --stat
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations tests/planning-confirmation-attestation-v39.test.ts
          git commit -m "Align v39 migration filenames with Supabase ledger"
          git push origin HEAD:${GITHUB_REF_NAME}
