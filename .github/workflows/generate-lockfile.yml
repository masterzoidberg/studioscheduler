name: Generate npm lockfile

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile
        run: |
          npm --version
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion !== 3) process.exit(1); console.log('lockfileVersion', p.lockfileVersion)"
      - name: Commit lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "Add npm package lock"
          git push origin HEAD:${GITHUB_HEAD_REF}
