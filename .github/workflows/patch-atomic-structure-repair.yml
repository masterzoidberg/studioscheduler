name: Patch atomic structure repair UI

on:
  push:
    branches:
      - feat/atomic-rulebook-structure-repair
    paths:
      - .github/workflows/patch-atomic-structure-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Make reviewed repair fields read-only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/classes-view.tsx")
          text = path.read_text()

          replacements = [
            (
              '<input value={editing.name} onChange={(event) => setEditing({ ...editing, name: event.target.value })} className=',
              '<input readOnly={Boolean(activeRepair)} value={editing.name} onChange={(event) => setEditing({ ...editing, name: event.target.value })} className='
            ),
            (
              '<input value={editing.subject} onChange={(event) => setEditing({ ...editing, subject: event.target.value })} placeholder=',
              '<input readOnly={Boolean(activeRepair)} value={editing.subject} onChange={(event) => setEditing({ ...editing, subject: event.target.value })} placeholder='
            ),
            (
              '<input value={editing.level} onChange={(event) => setEditing({ ...editing, level: event.target.value })} className=',
              '<input readOnly={Boolean(activeRepair)} value={editing.level} onChange={(event) => setEditing({ ...editing, level: event.target.value })} className='
            ),
            (
              '<input type="number" min={1} value={editing.durationMinutes || ""} onChange=',
              '<input type="number" min={1} readOnly={Boolean(activeRepair)} value={editing.durationMinutes || ""} onChange='
            ),
            (
              '<input type="number" min={1} value={editing.weeklyFrequency} onChange=',
              '<input type="number" min={1} readOnly={Boolean(activeRepair)} value={editing.weeklyFrequency} onChange='
            ),
            (
              '<input type="checkbox" checked={selected} onChange={() => toggleStudent(item.id)} />',
              '<input type="checkbox" disabled={Boolean(activeRepair)} checked={selected} onChange={() => toggleStudent(item.id)} />'
            ),
            (
              '<input type="checkbox" checked={Boolean(editing.companyOnly)} onChange=',
              '<input type="checkbox" disabled={Boolean(activeRepair)} checked={Boolean(editing.companyOnly)} onChange='
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one target for {old[:70]!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- components/classes-view.tsx
      - name: Commit read-only repair UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/classes-view.tsx
          git commit -m "Make Rulebook repair review-only"
          git push origin HEAD:${GITHUB_REF_NAME}
