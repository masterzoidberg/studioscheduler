name: Patch atomic structure repair UI

on:
  push:
    branches:
      - feat/atomic-rulebook-structure-repair
    paths:
      - .github/workflows/patch-atomic-structure-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact atomic repair patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/classes-view.tsx")
          text = path.read_text()

          replacements = [
            (
              'import { mutatePlanningEntity, updateClassSessionDurations } from "@/lib/planning-inventory-client";',
              'import { applyRulebookStructureRepair, mutatePlanningEntity, updateClassSessionDurations } from "@/lib/planning-inventory-client";'
            ),
            (
              '  async function save() {\n    if (!editing || !canEdit || saving) return;\n',
              '''  async function save() {\n    if (!editing || !canEdit || saving) return;\n\n    if (activeRepair && !creating) {\n      if (!original || activeRepair.classId !== editing.id) {\n        setNotice("The Rulebook repair target changed while the editor was open. Refresh and review the repair again.");\n        return;\n      }\n      const firstExpectedDuration = activeRepair.expectedDurations?.[0] ?? null;\n      const uniformExpectedDuration = firstExpectedDuration != null\n        && activeRepair.expectedDurations?.every((value) => value === firstExpectedDuration)\n        ? firstExpectedDuration\n        : null;\n      const unrelatedFieldsChanged = original.name !== editing.name\n        || original.subject !== editing.subject\n        || original.level !== editing.level\n        || original.companyOnly !== editing.companyOnly\n        || original.rosterStudentIds.length !== editing.rosterStudentIds.length\n        || original.rosterStudentIds.some((id) => !editing.rosterStudentIds.includes(id))\n        || (uniformExpectedDuration == null && original.durationMinutes !== editing.durationMinutes);\n      if (unrelatedFieldsChanged) {\n        setNotice("A Rulebook structure repair cannot be mixed with curriculum, roster, scope, or unrelated duration edits. Cancel and make those changes separately.");\n        return;\n      }\n      if (editing.weeklyFrequency !== activeRepair.expectedFrequency\n        || (uniformExpectedDuration != null && editing.durationMinutes !== uniformExpectedDuration)) {\n        setNotice("The reviewed repair values were changed in the editor. Restore the Rulebook-established structure or cancel the repair.");\n        return;\n      }\n\n      setSaving(true);\n      setNotice("");\n      const result = await applyRulebookStructureRepair({\n        classId: editing.id,\n        reason: `Applied atomic reviewed Rulebook structure repair for ${editing.name} (${activeRepair.ruleIds.join(", ")})`,\n        expectedPlanningDatasetVersion: currentPlanningDatasetVersion,\n      });\n      setSaving(false);\n      if (!result.ok) {\n        setNotice(result.error || "Rulebook structure repair failed.");\n        return;\n      }\n      await refresh();\n      closeEditor();\n      setNotice(`Applied the complete Rulebook structure repair atomically. Planning Dataset is now v${result.planningDatasetVersion ?? currentPlanningDatasetVersion}; the existing schedule needs revalidation.`);\n      return;\n    }\n'''
            ),
            (
              'This class requires distinct weekly durations ({activeRepair.expectedDurations.join("/")} minutes). If session rows must first be created by a frequency change, save the class structure, reopen it, then set the per-session overrides.',
              'This class requires distinct weekly durations ({activeRepair.expectedDurations.join("/")} minutes). The reviewed repair will create/reconcile every required session and duration in one atomic transaction.'
            ),
            (
              '{!creating && editingSessions.length ? (',
              '{!activeRepair && !creating && editingSessions.length ? ('
            ),
            (
              '{saving ? "Saving…" : creating ? "Add class" : "Save class"}',
              '{saving ? "Saving…" : activeRepair ? "Apply reviewed repair" : creating ? "Add class" : "Save class"}'
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one target for {old[:70]!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- components/classes-view.tsx
      - name: Commit surgical UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/classes-view.tsx
          git commit -m "Use atomic Rulebook structure repair from classes UI"
          git push origin HEAD:${GITHUB_REF_NAME}
