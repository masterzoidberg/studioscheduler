name: Solver Image

on:
  push:
    branches: [main]
    paths:
      - "solver/**"
      - ".github/workflows/solver-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: solver-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: masterzoidberg/studioscheduler-solver

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish solver image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./solver
          file: ./solver/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=DWDE CP-SAT Feasibility Solver
          cache-from: type=gha,scope=dwde-solver
          cache-to: type=gha,mode=max,scope=dwde-solver

      - name: Record immutable image reference
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "Commit tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
