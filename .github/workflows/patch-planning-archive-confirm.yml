name: Patch planning archive confirmation

on:
  push:
    branches:
      - feat/planning-inventory-lifecycle
    paths:
      - .github/workflows/patch-planning-archive-confirm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Add explicit archive confirmation
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 target, found {n}')
              p.write_text(text.replace(old,new,1))

          once('components/people-view.tsx',
            '''  async function archiveEntity(entityType: "TEACHER" | "STUDENT" | "ROOM", entityId: string, name: string) {\n    if (!canEdit || saving) return;\n    setSaving(true);''',
            '''  async function archiveEntity(entityType: "TEACHER" | "STUDENT" | "ROOM", entityId: string, name: string) {\n    if (!canEdit || saving) return;\n    if (!window.confirm(`Archive ${name} from the active planning inventory? The record will remain in history and can be restored later.`)) return;\n    setSaving(true);''')

          once('components/classes-view.tsx',
            '''  async function archiveClass() {\n    if (!editing || creating || activeRepair || !canEdit || saving) return;\n    setSaving(true);''',
            '''  async function archiveClass() {\n    if (!editing || creating || activeRepair || !canEdit || saving) return;\n    if (!window.confirm(`Archive ${editing.name} and its weekly sessions from active planning? Historical schedule records will be preserved and the class can be restored later.`)) return;\n    setSaving(true);''')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/people-view.tsx components/classes-view.tsx
          git commit -m "Confirm planning inventory archives"
          git push origin HEAD:${GITHUB_REF_NAME}
