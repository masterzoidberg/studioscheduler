name: Patch entity-version snapshot shape

on:
  push:
    branches:
      - feat/atomic-rulebook-structure-repair
    paths:
      - .github/workflows/patch-entity-version-shape.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Preserve class entity-version shape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/migrations/20260904064000_atomic_rulebook_structure_repair_v35.sql")
          text = path.read_text()
          old = "    v_studio,'CLASS',p_class_id,v_entity_version,v_uid,v_actor,p_reason,v_before,v_after\n"
          new = "    v_studio,'CLASS',p_class_id,v_entity_version,v_uid,v_actor,p_reason,v_before->'class',v_after->'class'\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one entity-version insert target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- supabase/migrations/20260904064000_atomic_rulebook_structure_repair_v35.sql
      - name: Commit shape fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260904064000_atomic_rulebook_structure_repair_v35.sql
          git commit -m "Preserve class entity-version snapshot shape"
          git push origin HEAD:${GITHUB_REF_NAME}
