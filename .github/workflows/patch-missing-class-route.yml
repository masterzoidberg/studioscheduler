name: Patch missing-class intake routing

on:
  push:
    branches:
      - fix/route-missing-required-classes-through-intake
    paths:
      - .github/workflows/patch-missing-class-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact routing patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/classes-view.tsx")
          text = path.read_text()

          old = "  function beginRulebookRepair(repair: RulebookClassStructureRepair) {\n    if (!state) return;\n    if (repair.status === \"AMBIGUOUS\") {\n"
          new = "  function beginRulebookRepair(repair: RulebookClassStructureRepair) {\n    if (!state) return;\n    if (repair.status === \"MISSING\") {\n      window.location.assign(\"/planning-repairs\");\n      return;\n    }\n    if (repair.status === \"AMBIGUOUS\") {\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one beginRulebookRepair target, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_button = '<button type="button" onClick={() => beginRulebookRepair(repair)} className="min-h-10 shrink-0 rounded-xl border border-amber-300 bg-amber-100 px-3 text-xs font-semibold text-amber-950">Review repair</button>'
          new_button = '<button type="button" onClick={() => beginRulebookRepair(repair)} className="min-h-10 shrink-0 rounded-xl border border-amber-300 bg-amber-100 px-3 text-xs font-semibold text-amber-950">{repair.status === "MISSING" ? "Use reviewed intake" : "Review repair"}</button>'
          if text.count(old_button) != 1:
              raise SystemExit(f"expected one repair button target, found {text.count(old_button)}")
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- components/classes-view.tsx
      - name: Commit surgical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/classes-view.tsx
          git commit -m "Route missing structure repairs to reviewed intake"
          git push origin HEAD:${GITHUB_REF_NAME}
