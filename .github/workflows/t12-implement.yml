name: T12 Authoritative Recovery

on:
  push:
    branches:
      - feat/pre-cami-hardening
    paths:
      - .github/t12-apply.py
      - .github/t12-fix.py
      - .github/workflows/t12-implement.yml

permissions:
  contents: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply T12 patch
        run: |
          python .github/t12-apply.py
          python .github/t12-fix.py
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: runner.os == 'Linux'
        run: npm run test:db

  commit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/pre-cami-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply accepted T12 patch
        run: |
          python .github/t12-apply.py
          python .github/t12-fix.py
      - name: Commit implementation
        id: implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components lib scripts supabase/migrations tests
          git commit -m 'feat: route schedule recovery through authoritative IR'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Finalize canonical plan
        run: python .github/t12-apply.py finalize '${{ steps.implementation.outputs.sha }}' '${{ github.run_id }}'
      - name: Remove one-time helpers and commit handoff
        shell: bash
        run: |
          git rm .github/t12-apply.py .github/t12-fix.py .github/workflows/t12-implement.yml
          git add plans
          git commit -m 'docs: accept T12 and queue T13'
          git push origin HEAD:feat/pre-cami-hardening
