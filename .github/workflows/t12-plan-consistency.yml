name: T12 Plan Consistency Fix

on:
  push:
    branches:
      - feat/pre-cami-hardening
    paths:
      - .github/workflows/t12-plan-consistency.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/pre-cami-hardening
          fetch-depth: 0
      - name: Align T13 detailed status with accepted dependency state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('plans/TASKS.md')
          text = path.read_text(encoding='utf-8')
          anchor = text.index('<a id="t13"></a>')
          before, tail = text[:anchor], text[anchor:]
          old = '| Status | NOT_STARTED |\n| Milestone | A |\n| Priority | P0 |\n| Dependencies | T10, T11, T12 |'
          new = '| Status | READY |\n| Milestone | A |\n| Priority | P0 |\n| Dependencies | T10, T11, T12 |'
          if tail.count(old) != 1:
              raise SystemExit(f'expected exactly one T13 detailed status marker, found {tail.count(old)}')
          path.write_text(before + tail.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/t12-plan-consistency.yml
          git add plans/TASKS.md
          git commit -m 'docs: align T13 detailed status with READY index'
          git push origin HEAD:feat/pre-cami-hardening
