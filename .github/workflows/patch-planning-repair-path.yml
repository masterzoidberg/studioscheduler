name: Patch planning repair path

on:
  push:
    branches:
      - feat/clarify-planning-repair-path
    paths:
      - .github/workflows/patch-planning-repair-path.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Clarify deterministic versus manager-input repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/planning-repairs-view.tsx')
          text = path.read_text()

          old = '''  const rosterRepairs = useMemo(\n    () => state ? rulebookRosterRepairs({ classes: state.classes, students: state.students }) : [],\n    [state],\n  );\n\n  if (!state) return null;\n'''
          new = '''  const rosterRepairs = useMemo(\n    () => state ? rulebookRosterRepairs({ classes: state.classes, students: state.students }) : [],\n    [state],\n  );\n  const existingStructureRepairs = structureRepairs.filter((repair) => repair.status === "MISMATCH");\n  const missingStructureRepairs = structureRepairs.filter((repair) => repair.status === "MISSING");\n  const ambiguousStructureRepairs = structureRepairs.filter((repair) => repair.status === "AMBIGUOUS");\n\n  if (!state) return null;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'count target={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''          <p className="mt-2 text-sm leading-6 text-slate-600">\n            {structureRepairs.length\n              ? `${structureRepairs.length} verified Ballet/Pointe structure repair${structureRepairs.length === 1 ? "" : "s"} still need review.`\n              : "All verified Ballet/Pointe structure requirements are represented."}\n          </p>\n          <Link href="/classes" className="mt-4 inline-flex min-h-10 items-center rounded-xl border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-900">Open class repairs</Link>\n'''
          new = '''          {structureRepairs.length ? (\n            <>\n              <div className="mt-3 space-y-2 text-xs leading-5 text-slate-700">\n                {existingStructureRepairs.length ? <p><strong>{existingStructureRepairs.length} existing class{existingStructureRepairs.length === 1 ? "" : "es"}</strong> can be brought to the reviewed Rulebook structure without inventing curriculum facts.</p> : null}\n                {missingStructureRepairs.length ? <p><strong>{missingStructureRepairs.length} required class{missingStructureRepairs.length === 1 ? " is" : "es are"} missing</strong> and need manager-reviewed intake for the planning facts the Rulebook does not establish.</p> : null}\n                {ambiguousStructureRepairs.length ? <p><strong>{ambiguousStructureRepairs.length} class name{ambiguousStructureRepairs.length === 1 ? " is" : "s are"} ambiguous</strong> and must be resolved before a safe repair can be selected.</p> : null}\n              </div>\n              <div className="mt-4 flex flex-wrap gap-2">\n                {existingStructureRepairs.length || ambiguousStructureRepairs.length ? <Link href="/classes" className="inline-flex min-h-10 items-center rounded-xl border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-900">Review existing classes</Link> : null}\n                {missingStructureRepairs.length ? <a href="#required-class-intake" className="inline-flex min-h-10 items-center rounded-xl border border-sky-300 bg-white px-3 text-xs font-semibold text-sky-950">Review missing-class intake</a> : null}\n              </div>\n            </>\n          ) : (\n            <p className="mt-2 text-sm leading-6 text-slate-600">All verified Ballet/Pointe structure requirements are represented.</p>\n          )}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'stage target={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          intake = Path('components/required-class-intake.tsx')
          text = intake.read_text()
          old = '''    <section className={`rounded-2xl border p-5 ${candidates.length ? "border-sky-200 bg-sky-50/40" : "border-emerald-200 bg-emerald-50/50"}`}>'''
          new = '''    <section id="required-class-intake" className={`scroll-mt-6 rounded-2xl border p-5 ${candidates.length ? "border-sky-200 bg-sky-50/40" : "border-emerald-200 bg-emerald-50/50"}`}>'''
          if text.count(old) != 1:
              raise SystemExit(f'intake target={text.count(old)}')
          intake.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- components/planning-repairs-view.tsx components/required-class-intake.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/planning-repairs-view.tsx components/required-class-intake.tsx
          git commit -m "Clarify planning repair evidence paths"
          git push origin HEAD:${GITHUB_REF_NAME}
