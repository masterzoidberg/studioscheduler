name: T06 Plan Finalize

on:
  push:
    branches:
      - feat/pre-cami-hardening

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Update canonical plan
        run: python scripts/finalize-t06-plan.py
      - name: Remove one-time files
        run: |
          rm scripts/finalize-t06-plan.py
          rm .github/workflows/t06-plan-finalize.yml
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans/README.md plans/NEXT.md plans/TASKS.md plans/DWDE_RELEASE_PLAN.md scripts/finalize-t06-plan.py .github/workflows/t06-plan-finalize.yml
          git commit -m "docs: accept T06 and queue T07"
          git push origin HEAD:feat/pre-cami-hardening
