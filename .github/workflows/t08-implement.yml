name: T08 Implementation

on:
  push:
    branches:
      - feat/pre-cami-hardening
    paths:
      - .github/t08-apply.py
      - .github/t08-fix.py
      - .github/workflows/t08-implement.yml

permissions:
  contents: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply T08 patch
        run: |
          python .github/t08-apply.py
          python .github/t08-fix.py
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: runner.os == 'Linux'
        run: npm run test:db

  commit:
    needs: quality
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/feat/pre-cami-hardening' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/pre-cami-hardening
      - name: Apply accepted T08 patch
        run: |
          python .github/t08-apply.py
          python .github/t08-fix.py
      - name: Remove one-time implementation helpers
        run: rm .github/t08-apply.py .github/t08-fix.py .github/workflows/t08-implement.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit T08
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bind reviewed solver candidates to base schedule"
          git push origin HEAD:feat/pre-cami-hardening
