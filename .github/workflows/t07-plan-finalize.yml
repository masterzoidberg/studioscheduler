name: T07 Plan Finalize

on:
  push:
    branches: [feat/pre-cami-hardening]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Update canonical plan
        run: python .github/t07-plan-finalize.py
      - name: Remove one-time finalizer
        run: rm .github/t07-plan-finalize.py .github/workflows/t07-plan-finalize.yml
      - name: Validate diff
        run: git diff --check
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans/README.md plans/NEXT.md plans/TASKS.md plans/DWDE_RELEASE_PLAN.md .github/t07-plan-finalize.py .github/workflows/t07-plan-finalize.yml
          git commit -m "docs: accept T07 and queue T08"
          git push origin HEAD:feat/pre-cami-hardening
