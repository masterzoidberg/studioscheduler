name: Solver CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "solver/**"
      - "lib/domain.ts"
      - "lib/constraint-*.ts"
      - "lib/solver-*.ts"
      - "lib/legacy-safety-bridge.ts"
      - "lib/server-studio-state.ts"
      - "app/api/solver/**"
      - "tests/fixtures/**"
      - "tests/*solver*.test.ts"
      - "tests/*constraint*.test.ts"
      - ".github/workflows/solver-ci.yml"

jobs:
  cp-sat-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned solver dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CP-SAT and service fixtures
        run: python -m pytest -q
      - name: Build production solver container
        run: docker build -t dwde-solver:test .
