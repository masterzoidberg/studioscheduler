name: Solver CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "solver/**"
      - "lib/domain.ts"
      - "lib/constraint-*.ts"
      - "lib/solver-*.ts"
      - "lib/legacy-safety-bridge.ts"
      - "lib/server-studio-state.ts"
      - "app/api/solver/**"
      - "tests/fixtures/**"
      - "tests/*solver*.test.ts"
      - "tests/*constraint*.test.ts"
      - "tests/runtime-parity.test.ts"
      - "scripts/test-parity.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/solver-ci.yml"

jobs:
  cp-sat-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned solver dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CP-SAT and service fixtures
        run: python -m pytest -q
      - name: Build production solver container
        run: docker build -t dwde-solver:test .

  runtime-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned solver dependencies
        run: python -m pip install -r solver/requirements.txt
      - name: Compare Python solver and TypeScript authority
        run: npm run test:parity
