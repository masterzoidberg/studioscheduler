name: T09 Session Locks

on:
  push:
    paths:
      - ".github/workflows/t09-implement.yml"

permissions:
  contents: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply T09 patch
        run: |
          python .github/t09-apply.py apply
          python .github/t09-fix.py
      - name: Pin npm
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Disposable database integration
        if: runner.os == 'Linux'
        run: npm run test:db
      - name: Python solver tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv solver/.venv-t09
          solver/.venv-t09/bin/python -m pip install --upgrade pip
          solver/.venv-t09/bin/python -m pip install -r solver/requirements.txt
          (cd solver && .venv-t09/bin/python -m pytest -q)

  commit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply accepted T09 patch
        run: |
          python .github/t09-apply.py apply
          python .github/t09-fix.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/solver-problem.ts solver/dwde_solver/service.py solver/dwde_solver/feasibility.py solver/tests/test_service.py solver/tests/test_session_locks.py tests/fixtures/session-lock-semantics.json tests/session-specific-locks.test.ts tests/session-lock-adoption.test.ts supabase/migrations/20260907090000_session_specific_solver_locks_v45.sql scripts/test-db.mjs
          git diff --cached --check
          git commit -m "feat: make solver locks session-specific"
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Finalize canonical plan
        run: python .github/t09-apply.py finalize "$CODE_SHA" "${{ github.run_id }}"
      - name: Remove one-time helpers and commit handoff
        shell: bash
        run: |
          rm .github/t09-apply.py .github/t09-fix.py .github/workflows/t09-implement.yml
          git add plans/README.md plans/NEXT.md plans/TASKS.md plans/DWDE_RELEASE_PLAN.md .github/t09-apply.py .github/t09-fix.py .github/workflows/t09-implement.yml
          git diff --cached --check
          git commit -m "docs: accept T09 and queue T10"
          git push origin HEAD:feat/pre-cami-hardening

# rerun: qualification-aware shared fixture
